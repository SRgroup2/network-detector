name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/rampurya/livedetector app/src/main/res
          
          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rampurya.livedetector">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:label="Live Network Detector" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # build.gradle (Module: app)
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' version '7.4.2' apply false }
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rampurya.livedetector'
              compileSdk 33
              defaultConfig {
                  applicationId "com.rampurya.livedetector"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # settings.gradle
          echo "include ':app'" > settings.gradle

          # build.gradle (Project level)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

      - name: Add MainActivity.kt
        run: |
          cat << 'EOF' > app/src/main/java/com/rampurya/livedetector/MainActivity.kt
          package com.rampurya.livedetector

          import android.content.Context
          import android.net.wifi.WifiManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.format.Formatter
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.io.BufferedReader
          import java.io.FileReader
          import java.net.InetAddress
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {
              private lateinit var listView: ListView
              private lateinit var statusText: TextView
              private lateinit var scanBtn: Button
              private val executor = Executors.newFixedThreadPool(40)
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 48, 32, 32)
                      setBackgroundColor(0xFF0F172A.toInt())
                  }
                  val title = TextView(this).apply {
                      text = "Rampurya Live Network Detector"
                      textSize = 18f
                      setTextColor(0xFFFFFFFF.toInt())
                  }
                  statusText = TextView(this).apply {
                      text = "Scanning real subnet..."
                      textSize = 13f
                      setTextColor(0xFF94A3B8.toInt())
                      setPadding(0, 10, 0, 20)
                  }
                  scanBtn = Button(this).apply {
                      text = "SCAN LIVE NETWORK"
                      setBackgroundColor(0xFF2563EB.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                  }
                  listView = ListView(this).apply { setPadding(0, 20, 0, 0) }
                  root.addView(title); root.addView(statusText); root.addView(scanBtn); root.addView(listView)
                  setContentView(root)
                  scanBtn.setOnClickListener { startScan() }
                  startScan()
              }

              private fun startScan() {
                  scanBtn.isEnabled = false
                  statusText.text = "Pinging active IPs..."
                  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  val ip = Formatter.formatIpAddress(wm.connectionInfo.ipAddress)
                  val prefix = if (ip.contains(".")) ip.substringBeforeLast(".") else "192.168.1"

                  val tasks = (1..254).map { i ->
                      executor.submit {
                          try { InetAddress.getByName("$prefix.$i").isReachable(300) } catch (_: Exception) {}
                      }
                  }

                  Thread {
                      tasks.forEach { it.get() }
                      val devices = mutableListOf<String>()
                      try {
                          BufferedReader(FileReader("/proc/net/arp")).use { br ->
                              var line: String?
                              br.readLine()
                              while (br.readLine().also { line = it } != null) {
                                  val p = line!!.trim().split(Regex("\\s+"))
                                  if (p.size >= 4 && p[2] != "0x0" && p[3] != "00:00:00:00:00:00") {
                                      devices.add("IP: ${p[0]}\nMAC: ${p[3]}")
                                  }
                              }
                          }
                      } catch (_: Exception) {}

                      mainHandler.post {
                          statusText.text = "Found ${devices.size} Active Devices on Network"
                          listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, devices)
                          scanBtn.isEnabled = true
                      }
                  }.start()
              }
          }
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
